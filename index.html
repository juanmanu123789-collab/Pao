<style>

    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }


    html,
    body {

        width: 100%;
        height: 100%;

        overflow: hidden;

        background: #000;

        font-family: Arial, sans-serif;

    }


    body {

        -webkit-tap-highlight-color: transparent;

        overscroll-behavior: none;

    }



    /* ================================= */
    /* PRIMERA PANTALLA */
    /* ================================= */

    .contenedor {

        width: 100%;
        height: 100dvh;
        min-height: 100vh;

        display: flex;

        flex-direction: column;

        justify-content: center;

        align-items: center;

        padding: 30px;

        text-align: center;

        background:
            radial-gradient(
                circle at center,
                #35115a 0%,
                #1c0835 45%,
                #08000f 100%
            );

        color: white;

        position: relative;

        z-index: 5;

        transition:
            opacity 1.2s ease,
            transform 1.2s ease;

    }


    .contenedor.oculto {

        opacity: 0;

        transform: scale(1.08);

        pointer-events: none;

    }



    /* ================================= */
    /* CORAZON INICIAL */
    /* ================================= */

    .corazon {

        font-size: 105px;

        margin-bottom: 25px;

        filter:
            drop-shadow(0 0 10px #ff4fce)
            drop-shadow(0 0 25px #ff1493)
            drop-shadow(0 0 50px #a900ff);

        animation:
            latido 1.5s infinite ease-in-out;

    }


    @keyframes latido {

        0% {
            transform: scale(1);
        }

        50% {
            transform: scale(1.12);
        }

        100% {
            transform: scale(1);
        }

    }



    /* ================================= */
    /* TEXTO */
    /* ================================= */

    .contenedor h1 {

        font-size: 34px;

        font-weight: 600;

        margin-bottom: 18px;

        text-shadow:
            0 0 10px rgba(255, 255, 255, 0.4),
            0 0 25px rgba(255, 50, 210, 0.5);

    }


    .contenedor p {

        max-width: 330px;

        font-size: 18px;

        line-height: 1.5;

        color: #f4dff7;

        margin-bottom: 35px;

    }



    /* ================================= */
    /* BOTON */
    /* ================================= */

    #abrirBtn {

        border: 1px solid rgba(255, 120, 230, 0.9);

        background:
            linear-gradient(
                135deg,
                rgba(255, 70, 190, 0.25),
                rgba(140, 20, 190, 0.3)
            );

        color: white;

        padding: 17px 32px;

        border-radius: 50px;

        font-size: 17px;

        font-weight: bold;

        cursor: pointer;

        box-shadow:
            0 0 10px rgba(255, 0, 200, 0.5),
            0 0 25px rgba(200, 0, 255, 0.35),
            inset 0 0 15px rgba(255, 0, 200, 0.15);

        transition:
            transform 0.25s ease,
            box-shadow 0.25s ease;

        -webkit-appearance: none;

        appearance: none;

    }


    #abrirBtn:active {

        transform: scale(0.94);

        box-shadow:
            0 0 20px rgba(255, 0, 220, 0.8),
            0 0 50px rgba(190, 0, 255, 0.5);

    }



    /* ================================= */
    /* SEGUNDA PANTALLA */
    /* ================================= */

    .segundaPantalla {

        position: fixed;

        inset: 0;

        width: 100%;

        height: 100dvh;

        min-height: 100vh;

        background: #000;

        opacity: 0;

        pointer-events: none;

        transition: opacity 2s ease;

        overflow: hidden;

    }


    .segundaPantalla.activa {

        opacity: 1;

        pointer-events: auto;

    }


    #galaxia {

        position: absolute;

        left: 0;

        top: 0;

        width: 100%;

        height: 100%;

        display: block;

        background: #000;

        touch-action: none;

    }


    /* ================================= */
    /* AJUSTES PARA IPHONE */
    /* ================================= */

    @supports (padding: env(safe-area-inset-top)) {

        .contenedor {

            padding-top:
                calc(
                    30px +
                    env(safe-area-inset-top)
                );

            padding-bottom:
                calc(
                    30px +
                    env(safe-area-inset-bottom)
                );

        }

    }


</style>

<!-- ========================= -->

<main

<!-- ========================= -->
<!-- SEGUNDA PANTALLA -->
<!-- ========================= -->

<main
    class="segundaPantalla"
    id="segundaPantalla"
>

    <canvas id="galaxia"></canvas>

</main>



<script>


    /* ================================= */
    /* ELEMENTOS */
    /* ================================= */

    const pantallaInicial =
        document.getElementById("pantallaInicial");


    const segundaPantalla =
        document.getElementById("segundaPantalla");


    const abrirBtn =
        document.getElementById("abrirBtn");


    const canvas =
        document.getElementById("galaxia");


    const ctx =
        canvas.getContext("2d");



    /* ================================= */
    /* VARIABLES */
    /* ================================= */

    let ancho = 0;

    let alto = 0;

    let centroX = 0;

    let centroY = 0;

    let tiempo = 0;



    /* ================================= */
    /* FRASES */
    /* ================================= */

    const frases = [

"te adoro",
        "te quiero",
        "eres hermosa",
        "preciosa",
        "perfecta",
        "mi princesa",
        "mi niña",
        "mi reyna",

        "mi amor",
        "mi vida",
        "mi cielo",
        "mi mundo",
        "mi felicidad",
        "eres mi todo",
        "eres mi paz",
        "eres mi universo",
        "eres mi estrella",
        "mi niña hermosa",
        "mi niña preciosa",
        "la mas hermosa",
        "me encantas",
        "me vuelves loco",
        "amo tu sonrisa",
        "amo tus ojos",
        "amo estar contigo",
        "mi corazon es tuyo",
        "mi amor es para ti",
        "tu y yo",
        "solo tu",
        "siempre tu",
        "infinitamente tu",
        "eres lo mejor de mi vida",
        "eres el amor de mi vida"

    ];



    /* ================================= */
    /* PARTICULAS */
    /* ================================= */

    let estrellas = [];

    let particulasGalaxia = [];

    let particulasCorazonInterior = [];

    let particulasCorazonContorno = [];

    let particulasAnillo = [];

    let palabras = [];



    /* ================================= */
    /* CONFIGURACION */
    /* ================================= */

    const configuracion = {

        estrellas: 350,

        galaxia: 3300,

        corazonInterior: 850,

        corazonContorno: 1000,

        anillo: 700,

        inclinacion: 0.22

    };



    /* ================================= */
    /* CANVAS */
    /* ================================= */

    function ajustarCanvas() {

        const pixelRatio =
            Math.min(
                window.devicePixelRatio || 1,
                2
            );


        ancho =
            window.innerWidth;


        alto =
            window.innerHeight;


        canvas.width =
            ancho * pixelRatio;


        canvas.height =
            alto * pixelRatio;


        canvas.style.width =
            ancho + "px";


        canvas.style.height =
            alto + "px";


        ctx.setTransform(
            pixelRatio,
            0,
            0,
            pixelRatio,
            0,
            0
        );


        centroX =
            ancho / 2;


        centroY =
            alto * 0.59;

    }


    window.addEventListener(
        "resize",
        ajustarCanvas
    );


    ajustarCanvas();



    /* ================================= */
    /* ESTRELLAS DEL FONDO */
    /* ================================= */

    function crearEstrellas() {

        estrellas = [];


        for (
            let i = 0;
            i < configuracion.estrellas;
            i++
        ) {

            estrellas.push({

                x: Math.random(),

                y: Math.random(),

                tamano:
                    Math.random() *
                    1.4 +
                    0.2,

                brillo:
                    Math.random() *
                    0.8 +
                    0.2,

                fase:
                    Math.random() *
                    Math.PI *
                    2

            });

        }

    }



    /* ================================= */
    /* GALAXIA */
    /* ================================= */

    function crearGalaxia() {

        particulasGalaxia = [];


        for (
            let i = 0;
            i < configuracion.galaxia;
            i++
        ) {

            const anguloInicial =
                Math.random() *
                Math.PI *
                2;


            const radioNormalizado =
                Math.pow(
                    Math.random(),
                    0.62
                );


            const radioMaximo =
                Math.min(
                    ancho * 0.90,
                    alto * 0.70
                );


            const distancia =
                radioNormalizado *
                radioMaximo;


            const giro =
                distancia *
                0.012;


            const angulo =
                anguloInicial +
                giro;


            let x =
                Math.cos(angulo) *
                distancia;


            let y =
                Math.sin(angulo) *
                distancia *
                configuracion.inclinacion;


            const grosor =
                (
                    Math.random() - 0.5
                ) *
                (
                    20 +
                    distancia * 0.16
                );


            y += grosor;


            const tipo =
                Math.random();


            particulasGalaxia.push({

                x: x,

                y: y,

                distancia: distancia,

                angulo: angulo,

                velocidad:
                    0.00015 +
                    Math.random() *
                    0.0005,

                tamano:
                    Math.random() *
                    1.35 +
                    0.25,

                brillo:
                    Math.random() *
                    0.7 +
                    0.15,

                tipo: tipo,

                fase:
                    Math.random() *
                    Math.PI *
                    2

            });

        }

    }



    /* ================================= */
    /* FORMULA CORAZON */
    /* ================================= */

    function formulaCorazon(t) {

        const x =
            16 *
            Math.pow(
                Math.sin(t),
                3
            );


        const y =
            -(
                13 *
                Math.cos(t)
                -
                5 *
                Math.cos(2 * t)
                -
                2 *
                Math.cos(3 * t)
                -
                Math.cos(4 * t)
            );


        return {

            x: x,

            y: y

        };

    }



    /* ================================= */
    /* CREAR CORAZON */
    /* ================================= */

    function crearCorazon() {

        particulasCorazonInterior = [];

        particulasCorazonContorno = [];


        const escala =
            Math.min(
                ancho,
                alto
            ) * 0.010;


        for (
            let i = 0;
            i < configuracion.corazonContorno;
            i++
        ) {

            const t =
                Math.random() *
                Math.PI *
                2;


            const punto =
                formulaCorazon(t);


            const variacion =
                (
                    Math.random() -
                    0.5
                ) *
                1.3;


            particulasCorazonContorno.push({

                x:
                    punto.x *
                    escala +
                    variacion,

                y:
                    punto.y *
                    escala +
                    variacion,

                tamano:
                    Math.random() *
                    1.8 +
                    0.45,

                brillo:
                    Math.random() *
                    0.7 +
                    0.3,

                fase:
                    Math.random() *
                    Math.PI *
                    2,

                velocidad:
                    Math.random() *
                    0.025 +
                    0.01

            });

        }



        for (
            let i = 0;
            i < configuracion.corazonInterior;
            i++
        ) {

            const t =
                Math.random() *
                Math.PI *
                2;


            const punto =
                formulaCorazon(t);


            const relleno =
                Math.pow(
                    Math.random(),
                    0.65
                );


            particulasCorazonInterior.push({

                x:
                    punto.x *
                    escala *
                    relleno,

                y:
                    punto.y *
                    escala *
                    relleno,

                tamano:
                    Math.random() *
                    1.45 +
                    0.25,

                brillo:
                    Math.random() *
                    0.65 +
                    0.15,

                fase:
                    Math.random() *
                    Math.PI *
                    2,

                velocidad:
                    Math.random() *
                    0.025 +
                    0.008

            });

        }

    }



    /* ================================= */
    /* ANILLO AMARILLO */
    /* ================================= */

    function crearAnillo() {

        particulasAnillo = [];


        const radioX =
            Math.min(
                ancho,
                alto
            ) * 0.105;


        const radioY =
            radioX * 0.28;


        for (
            let i = 0;
            i < configuracion.anillo;
            i++
        ) {

            const angulo =
                Math.random() *
                Math.PI *
                2;


            const variacion =
                (
                    Math.random() -
                    0.5
                ) *
                18;


            const rx =
                radioX +
                variacion;


            const ry =
                radioY +
                variacion * 0.25;


            particulasAnillo.push({

                angulo: angulo,

                radioX: rx,

                radioY: ry,

                tamano:
                    Math.random() *
                    1.6 +
                    0.35,

                brillo:
                    Math.random() *
                    0.75 +
                    0.2,

                velocidad:
                    0.0003 +
                    Math.random() *
                    0.001,

                fase:
                    Math.random() *
                    Math.PI *
                    2

            });

        }

    }



    /* ================================= */
    /* FRASES */
    /* ================================= */

    function crearPalabras() {

        palabras = [];


        frases.forEach(
            (texto, indice) => {

                palabras.push({

                    texto: texto,

                    angulo:
                        (
                            Math.PI * 2 /
                            frases.length
                        ) *
                        indice,

                    radio:
                        155 +
                        Math.random() *
                        145,

                    velocidad:
                        0.00010 +
                        Math.random() *
                        0.00008,

                    escala:
                        0.7 +
                        Math.random() *
                        0.45,

                    fase:
                        Math.random() *
                        Math.PI *
                        2

                });

            }
        );

    }



    /* ================================= */
    /* FONDO */
    /* ================================= */

    function dibujarEstrellas() {

        for (
            const estrella of estrellas
        ) {

            const x =
                estrella.x *
                ancho;


            const y =
                estrella.y *
                alto;


            const brillo =
                estrella.brillo *
                (
                    0.6 +
                    Math.sin(
                        tiempo *
                        0.002 +
                        estrella.fase
                    ) *
                    0.4
                );


            ctx.beginPath();


            ctx.fillStyle =
                `rgba(
                    255,
                    255,
                    255,
                    ${brillo}
                )`;


            ctx.arc(
                x,
                y,
                estrella.tamano,
                0,
                Math.PI * 2
            );


            ctx.fill();

        }

    }



    /* ================================= */
    /* GALAXIA */
    /* ================================= */

    function dibujarGalaxia() {

        ctx.save();


        ctx.translate(
            centroX,
            centroY
        );


        for (
            const particula
            of particulasGalaxia
        ) {

            particula.angulo +=
                particula.velocidad;


            const angulo =
                particula.angulo;


            const movimiento =
                Math.sin(
                    tiempo *
                    0.001 +
                    particula.fase
                ) *
                1.5;


            const x =
                Math.cos(angulo) *
                particula.distancia;


            const y =
                Math.sin(angulo) *
                particula.distancia *
                configuracion.inclinacion +
                movimiento;


            let rojo;

            let verde;

            let azul;


            if (
                particula.tipo < 0.35
            ) {

                rojo = 255;

                verde = 150;

                azul = 205;

            }
            else if (
                particula.tipo < 0.65
            ) {

                rojo = 235;

                verde = 100;

                azul = 180;

            }
            else {

                rojo = 180;

                verde = 65;

                azul = 170;

            }


            const distanciaNormalizada =
                particula.distancia /
                (
                    Math.min(
                        ancho * 0.90,
                        alto * 0.70
                    )
                );


            let brillo =
                particula.brillo;


            if (
                distanciaNormalizada <
                0.11
            ) {

                brillo *= 0.20;

            }


            ctx.beginPath();


            ctx.fillStyle =
                `rgba(
                    ${rojo},
                    ${verde},
                    ${azul},
                    ${brillo}
                )`;


            ctx.arc(
                x,
                y,
                particula.tamano,
                0,
                Math.PI * 2
            );


            ctx.fill();

        }


        ctx.restore();

    }



    /* ================================= */
    /* ANILLO CENTRAL */
    /* ================================= */

    function dibujarAnillo() {

        ctx.save();


        ctx.translate(
            centroX,
            centroY
        );


        for (
            const particula
            of particulasAnillo
        ) {

            particula.angulo +=
                particula.velocidad;


            const x =
                Math.cos(
                    particula.angulo
                ) *
                particula.radioX;


            const y =
                Math.sin(
                    particula.angulo
                ) *
                particula.radioY;


            const pulso =
                0.75 +
                Math.sin(
                    tiempo *
                    0.003 +
                    particula.fase
                ) *
                0.25;


            const rojo =
                255;


            const verde =
                180 +
                Math.floor(
                    Math.random() * 50
                );


            const azul =
                45 +
                Math.floor(
                    Math.random() * 45
                );


            ctx.beginPath();


            ctx.fillStyle =
                `rgba(
                    ${rojo},
                    ${verde},
                    ${azul},
                    ${particula.brillo * pulso}
                )`;


            ctx.shadowBlur = 5;


            ctx.shadowColor =
                "rgba(255,190,40,0.8)";


            ctx.arc(
                x,
                y,
                particula.tamano,
                0,
                Math.PI * 2
            );


            ctx.fill();

        }


        ctx.shadowBlur = 0;


        const radioNucleo =
            Math.min(
                ancho,
                alto
            ) * 0.052;


        const nucleo =
            ctx.createRadialGradient(
                0,
                0,
                1,
                0,
                0,
                radioNucleo
            );


        nucleo.addColorStop(
            0,
            "#000000"
        );


        nucleo.addColorStop(
            0.75,
            "#000000"
        );


        nucleo.addColorStop(
            0.92,
            "#080000"
        );


        nucleo.addColorStop(
            1,
            "rgba(255,150,30,0.15)"
        );


        ctx.beginPath();


        ctx.fillStyle =
            nucleo;


        ctx.arc(
            0,
            0,
            radioNucleo,
            0,
            Math.PI * 2
        );


        ctx.fill();


        ctx.restore();

    }



    /* ================================= */
    /* CORAZON */
    /* ================================= */

    function dibujarCorazon() {

        const altura =
            Math.min(
                ancho,
                alto
            ) * 0.18;


        const escalaFlotacion =
            1 +
            Math.sin(
                tiempo * 0.0015
            ) *
            0.025;


        const baseX =
            centroX;


        const baseY =
            centroY -
            altura;



        /* INTERIOR */

        for (
            const particula
            of particulasCorazonInterior
        ) {

            const movimiento =
                Math.sin(
                    tiempo *
                    particula.velocidad +
                    particula.fase
                ) *
                1.1;


            const x =
                baseX +
                particula.x *
                escalaFlotacion;


            const y =
                baseY +
                particula.y *
                escalaFlotacion +
                movimiento;


            const brillo =
                particula.brillo *
                (
                    0.65 +
                    Math.sin(
                        tiempo *
                        0.002 +
                        particula.fase
                    ) *
                    0.35
                );


            ctx.beginPath();


            ctx.fillStyle =
                `rgba(
                    235,
                    45,
                    205,
                    ${brillo}
                )`;


            ctx.arc(
                x,
                y,
                particula.tamano,
                0,
                Math.PI * 2
            );


            ctx.fill();

        }



        /* CONTORNO */

        for (
            const particula
            of particulasCorazonContorno
        ) {

            const movimiento =
                Math.sin(
                    tiempo *
                    particula.velocidad +
                    particula.fase
                ) *
                1.4;


            const x =
                baseX +
                particula.x *
                escalaFlotacion;


            const y =
                baseY +
                particula.y *
                escalaFlotacion +
                movimiento;


            const brillo =
                particula.brillo *
                (
                    0.7 +
                    Math.sin(
                        tiempo *
                        0.0025 +
                        particula.fase
                    ) *
                    0.3
                );


            ctx.beginPath();


            ctx.fillStyle =
                `rgba(
                    255,
                    70,
                    225,
                    ${brillo}
                )`;


            ctx.shadowBlur = 6;


            ctx.shadowColor =
                "rgba(255,0,210,0.9)";


            ctx.arc(
                x,
                y,
                particula.tamano,
                0,
                Math.PI * 2
            );


            ctx.fill();

        }


        ctx.shadowBlur = 0;

    }



    /* ================================= */
    /* DESTELLOS */
    /* ================================= */

    function dibujarDestellosCorazon() {

        const baseX =
            centroX;


        const baseY =
            centroY -
            Math.min(
                ancho,
                alto
            ) * 0.18;


        for (
            let i = 0;
            i < 40;
            i++
        ) {

            const angulo =
                tiempo *
                0.0007 +
                i;


            const radio =
                70 +
                Math.sin(
                    tiempo *
                    0.002 +
                    i
                ) *
                30;


            const x =
                baseX +
                Math.cos(angulo) *
                radio;


            const y =
                baseY +
                Math.sin(angulo) *
                radio *
                0.75;


            const alpha =
                0.15 +
                (
                    Math.sin(
                        tiempo *
                        0.003 +
                        i
                    ) + 1
                ) *
                0.20;


            ctx.beginPath();


            ctx.fillStyle =
                `rgba(
                    255,
                    80,
                    220,
                    ${alpha}
                )`;


            ctx.arc(
                x,
                y,
                0.8,
                0,
                Math.PI * 2
            );


            ctx.fill();

        }

    }



    /* ================================= */
    /* FRASES */
    /* ================================= */

    function dibujarPalabras() {

        ctx.save();


        ctx.textAlign =
            "center";


        ctx.textBaseline =
            "middle";


        palabras.forEach(
            (palabra) => {

                palabra.angulo +=
                    palabra.velocidad;


                const movimiento =
                    Math.sin(
                        tiempo *
                        0.001 +
                        palabra.fase
                    ) *
                    9;


                const radio =
                    palabra.radio +
                    movimiento;


                const x =
                    centroX +
                    Math.cos(
                        palabra.angulo
                    ) *
                    radio;


                const y =
                    centroY +
                    Math.sin(
                        palabra.angulo
                    ) *
                    radio *
                    configuracion.inclinacion;


                const profundidad =
                    0.72 +
                    (
                        Math.sin(
                            palabra.angulo
                        ) + 1
                    ) *
                    0.18;


                const escala =
                    palabra.escala *
                    profundidad;


                ctx.save();


                ctx.translate(
                    x,
                    y
                );


                ctx.rotate(
                    Math.sin(
                        palabra.angulo
                    ) *
                    0.10
                );


                ctx.scale(
                    escala,
                    escala
                );


                ctx.font =
                    "bold 10px Arial";


                ctx.fillStyle =
                    "rgba(255,185,225,0.92)";


                ctx.shadowBlur =
                    8;


                ctx.shadowColor =
                    "rgba(255,30,190,0.8)";


                ctx.fillText(
                    palabra.texto,
                    0,
                    0
                );


                ctx.restore();

            }
        );


        ctx.restore();

    }



    /* ================================= */
    /* ANIMACION */
    /* ================================= */

    function animar() {

        tiempo += 16;


        ctx.clearRect(
            0,
            0,
            ancho,
            alto
        );


        ctx.fillStyle =
            "#000";


        ctx.fillRect(
            0,
            0,
            ancho,
            alto
        );


        dibujarEstrellas();

        dibujarGalaxia();

        dibujarAnillo();

        dibujarCorazon();

        dibujarDestellosCorazon();

        dibujarPalabras();


        requestAnimationFrame(
            animar
        );

    }



    /* ================================= */
    /* INICIALIZAR */
    /* ================================= */

    crearEstrellas();

    crearGalaxia();

    crearCorazon();

    crearAnillo();

    crearPalabras();



    /* ================================= */
    /* BOTON */
    /* ================================= */

    abrirBtn.addEventListener(
        "click",
        () => {

            pantallaInicial.classList.add(
                "oculto"
            );


            setTimeout(
                () => {

                    segundaPantalla.classList.add(
                        "activa"
                    );

                },
                700
            );

        }
    );



    /* ================================= */
    /* ARRANCAR */
    /* ================================= */

    animar();


</script>
